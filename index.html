<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ECOENERG-IA">
<meta name="theme-color" content="#030b14">
<title>ECOENERG-IA</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#030b14;--bg2:#040d18;--bg3:#061a2e;--bg4:#030f1f;
    --border:#12344f;--border2:#0d2a42;
    --green:#00e5b4;--blue:#4c8dff;--purple:#a78bfa;--amber:#fbbf24;--red:#f87171;
    --text:#e6edf5;--muted:#93a9bf;--dim:#7e9bb8;
  }
  html,body{background:var(--bg);color:var(--text);font-family:'Exo 2',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;font-size:14px}
  body{background:radial-gradient(900px 400px at 50% -10%,#00e5b414,transparent),var(--bg)}
  ::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
  :focus-visible{outline:2px solid var(--green);outline-offset:2px}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(2.5);opacity:0}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  @keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .fade-in{animation:fadeIn .35s ease both}
  .hidden{display:none!important}

  #topbar{background:linear-gradient(90deg,#030b14,#061426 50%,#030b14);border-bottom:1px solid var(--border2);padding:0 14px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
  .logo{display:flex;align-items:center;gap:8px}
  .logo-icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--green),var(--blue));display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
  .logo-text{font-size:16px;font-weight:900;letter-spacing:1px;background:linear-gradient(135deg,var(--green),var(--blue));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .logo-sub{font-size:9px;color:var(--dim);letter-spacing:1.5px;font-weight:700}
  .live-badge{display:flex;align-items:center;gap:6px}
  .live-kw{font-size:14px;color:var(--green);font-weight:800;font-variant-numeric:tabular-nums}
  .live-label{font-size:10px;color:var(--dim)}
  .pulsedot{position:relative;display:inline-block;width:10px;height:10px;flex-shrink:0}
  .pulsedot::before{content:'';position:absolute;inset:0;border-radius:50%;background:var(--green);animation:pulse 1.5s ease-in-out infinite;opacity:.4}
  .pulsedot::after{content:'';position:absolute;inset:2px;border-radius:50%;background:var(--green)}
  .pulsedot.off::before,.pulsedot.off::after{background:var(--red)}
  .user-chip{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
  .user-chip b{font-size:11px;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .user-chip span{font-size:9px;color:var(--green);letter-spacing:1px;text-transform:uppercase;font-weight:700}

  #nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border2);scrollbar-width:none;position:sticky;top:56px;z-index:90}
  #nav::-webkit-scrollbar{display:none}
  .nav-btn{padding:8px 13px;border-radius:9px;border:none;cursor:pointer;font-weight:700;letter-spacing:.3px;transition:all .2s;white-space:nowrap;background:transparent;color:var(--muted);font-size:12px}
  .nav-btn:hover{color:var(--text)}
  .nav-btn.active{background:linear-gradient(135deg,var(--green),#0ea5e9);color:var(--bg);box-shadow:0 0 20px #00e5b440}

  #main{padding:14px;max-width:860px;margin:0 auto;width:100%;padding-bottom:96px}
  .card{background:linear-gradient(145deg,var(--bg3),var(--bg4));border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:0 4px 24px #00000060;position:relative;overflow:hidden;margin-bottom:12px}
  .card-title{font-size:11px;color:var(--dim);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px}
  .stat-val{font-size:32px;font-weight:900;color:var(--green);line-height:1;font-variant-numeric:tabular-nums}
  .stat-unit{font-size:12px;color:var(--dim);margin-left:3px}
  .sub{font-size:11px;color:var(--muted);margin-top:6px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .grid2 .card,.grid3 .card{margin-bottom:0}
  .mb{margin-bottom:12px}
  .badge{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:800;letter-spacing:.6px;border:1px solid}
  .section-title{font-size:18px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}

  .gauge-wrap{position:relative;display:inline-block}
  .gauge-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .gauge-val{font-weight:800;font-size:13px}
  .bar-row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .bar-label{font-size:11px;color:var(--muted);width:96px;flex-shrink:0;text-align:right}
  .bar-track{flex:1;height:7px;background:#0d2137;border-radius:4px;overflow:hidden}
  .bar-fill{height:100%;border-radius:4px;transition:width 1s ease}
  .bar-val{font-size:11px;font-weight:700;width:38px;text-align:right;flex-shrink:0}

  .chart{position:relative;touch-action:pan-y}
  .chart svg{display:block;width:100%;height:auto}
  .chart text{fill:var(--dim);font-size:10px;font-family:inherit}
  .legend{display:flex;gap:14px;margin-top:8px;font-size:11px;color:var(--muted);flex-wrap:wrap}
  .legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
  #tip{position:fixed;z-index:300;pointer-events:none;background:#020810f0;border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-size:11px;line-height:1.5;display:none;max-width:200px}

  .zone-card{background:linear-gradient(145deg,var(--bg3),var(--bg4));border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
  .zone-icon{font-size:26px;width:40px;text-align:center;flex-shrink:0}
  .zone-info{flex:1;min-width:0}
  .zone-name{font-size:14px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
  .zone-meta{font-size:11px;color:var(--muted);margin-top:3px}
  .zone-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
  .zone-kw{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums}

  .sensor-row{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid #12344f60}
  .sensor-row:last-child{border:0}
  .sensor-id{font-size:11px;color:var(--muted);font-family:'Rajdhani',monospace;font-weight:700;width:34px}
  .sensor-loc{flex:1;min-width:0}
  .sensor-type{font-size:11px;color:var(--dim);width:78px}
  .sensor-val{font-size:13px;font-weight:800;width:60px;text-align:right}

  .insight-card{border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid}
  .insight-title{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;margin-bottom:4px}
  .insight-msg{font-size:13px;line-height:1.5;opacity:.92}
  .insight-time{font-size:10px;color:var(--dim);margin-top:6px}

  .rank-row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:#12344f30;margin-bottom:6px}
  .rank-row.me{outline:1px solid var(--green);background:#00e5b414}
  .rank-num{font-size:19px;font-weight:900;width:30px;text-align:center}
  .rank-course{font-size:15px;font-weight:800;flex:1}
  .rank-pts{font-size:13px;font-weight:800;color:var(--green)}

  .trivia-opt{display:block;width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--border);background:transparent;cursor:pointer;text-align:left;margin-bottom:8px;transition:all .2s}
  .trivia-opt:hover:not(:disabled){border-color:var(--green);background:#00e5b410}
  .trivia-opt.correct{background:#00e5b420;border-color:var(--green);color:var(--green)}
  .trivia-opt.wrong{background:#f8717120;border-color:var(--red);color:var(--red)}
  .trivia-ans{margin-top:10px;padding:11px;border-radius:8px;background:#00e5b410;border:1px solid #00e5b430;font-size:12px;line-height:1.5;color:var(--green)}

  label.f{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.5px;margin-bottom:5px}
  .inp{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:11px 12px;outline:none;margin-bottom:12px}
  .inp:focus{border-color:var(--green)}
  select.inp{appearance:none}
  .btn{border:none;border-radius:10px;padding:11px 18px;cursor:pointer;font-weight:800;background:linear-gradient(135deg,var(--green),#0ea5e9);color:#03121c;transition:transform .1s,opacity .2s}
  .btn:active{transform:scale(.97)}.btn:disabled{opacity:.5;cursor:wait}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
  .btn.sm{padding:6px 12px;font-size:12px}
  .btn.block{width:100%}
  .btn.danger{background:#f8717122;border:1px solid #f8717166;color:var(--red)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  table.t{width:100%;border-collapse:collapse;font-size:13px}
  table.t th{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);text-align:left;padding:6px 4px;border-bottom:1px solid var(--border)}
  table.t td{padding:9px 4px;border-bottom:1px solid #12344f50;vertical-align:middle}
  table.t select{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:5px 8px}

  #auth{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
  .auth-card{width:100%;max-width:380px}
  .tabs2{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:16px}
  .tabs2 button{border:0;background:transparent;border-radius:9px;padding:9px;font-weight:700;color:var(--muted);cursor:pointer}
  .tabs2 button.on{background:linear-gradient(135deg,var(--green),#0ea5e9);color:#03121c}
  .msg{border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.5;margin-bottom:12px}
  .msg.err{background:#f8717118;border:1px solid #f8717155;color:#fecaca}
  .msg.ok{background:#00e5b418;border:1px solid #00e5b455;color:#a7f3e0}
  .spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}

  #chat-fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:16px;z-index:200}
  #chat-btn{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,var(--green),var(--blue));border:none;cursor:pointer;font-size:22px;box-shadow:0 0 30px #00e5b440}
  #chat-window{position:fixed;bottom:84px;right:14px;left:14px;max-width:380px;margin:0 0 0 auto;height:400px;background:#040f1c;border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;box-shadow:0 20px 60px #000a;animation:slideUp .25s ease;z-index:199}
  .chat-header{padding:10px 14px;border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:8px}
  .chat-msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:7px}
  .chat-msg{max-width:86%;padding:8px 11px;border-radius:11px;font-size:12px;line-height:1.5;word-break:break-word;white-space:pre-line}
  .chat-msg.ai{background:var(--bg3);border:1px solid var(--border2);align-self:flex-start}
  .chat-msg.user{background:linear-gradient(135deg,var(--green),#0ea5e9);color:#03121c;align-self:flex-end}
  .chat-input-row{padding:8px;border-top:1px solid var(--border2);display:flex;gap:6px}
  .chat-input-row .inp{margin:0;padding:9px 11px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 8px}
  .chips button{background:transparent;border:1px solid var(--border);border-radius:99px;padding:4px 10px;font-size:11px;color:var(--muted);cursor:pointer}

  #toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#020810;border:1px solid var(--border);border-radius:10px;padding:10px 16px;font-size:12px;z-index:400;max-width:90%;display:none}
  #toast.show{display:block;animation:fadeIn .2s}
  #install-banner{position:fixed;top:60px;left:12px;right:12px;max-width:420px;margin:0 auto;background:linear-gradient(135deg,#00e5b4,#0ea5e9);color:#03121c;padding:10px 14px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;z-index:250;font-size:12px;font-weight:700}

  .logo-text,.live-kw,.logo-sub{white-space:nowrap}
  @media(max-width:460px){.user-chip{display:none}}
  @media(max-width:520px){.logo-sub,.user-chip b{display:none}#topbar{padding:0 10px}.logo-text{font-size:15px}}
  @media(max-width:420px){.grid3{grid-template-columns:1fr 1fr 1fr;gap:8px}.grid3 .card{padding:12px}.stat-val{font-size:28px}.bar-label{width:76px}}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth" class="hidden">
  <div style="text-align:center;margin-bottom:26px;animation:fadeIn .6s ease">
    <div style="font-size:50px;margin-bottom:6px">⚡</div>
    <div class="logo-text" style="font-size:28px;letter-spacing:1px">ECOENERG-IA</div>
    <div style="font-size:11px;color:var(--dim);letter-spacing:3px;margin-top:4px">COLEGIO VILLAS DE SAN IGNACIO</div>
    <div style="font-size:13px;color:var(--muted);margin-top:8px">Monitoreo energético inteligente</div>
  </div>
  <div class="card auth-card" id="auth-card"></div>
</div>

<div id="boot" style="min-height:100vh;display:flex;align-items:center;justify-content:center"><div class="spinner"></div></div>

<div id="install-banner" class="hidden">
  <span>📲 Instalar ECOENERG-IA como app</span>
  <button class="btn sm" data-act="install" style="background:#03121c;color:var(--green)">Instalar</button>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div id="topbar">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <div><div class="logo-text">ECOENERG-IA</div><div class="logo-sub">VILLAS DE SAN IGNACIO</div></div>
    </div>
    <div class="row" style="gap:12px;flex-wrap:nowrap">
      <div class="live-badge" title="Consumo total más reciente">
        <span class="pulsedot" id="live-dot"></span>
        <span class="live-kw" id="live-kw">-- kW</span>
        <span class="badge hidden" id="demo-tag" title="Datos de demostración: las lecturas son simuladas" style="color:var(--amber);border-color:#fbbf2466;background:#fbbf2418;padding:1px 7px;font-size:9px">DEMO</span>
      </div>
      <div class="user-chip"><b id="u-name"></b><span id="u-role"></span></div>
      <button class="btn ghost sm" data-act="logout" aria-label="Cerrar sesión">Salir</button>
    </div>
  </div>
  <div id="nav" role="tablist"></div>
  <div id="main"></div>
</div>

<div id="chat-fab" class="hidden">
  <div id="chat-window" class="hidden">
    <div class="chat-header">
      <div class="logo-icon" style="width:28px;height:28px;font-size:14px">🤖</div>
      <div><div style="font-size:12px;font-weight:800;color:var(--green)">ENERG-IA</div><div style="font-size:10px;color:var(--dim)">Responde con tus datos en vivo</div></div>
      <button data-act="chat" class="btn ghost sm" style="margin-left:auto" aria-label="Cerrar chat">✕</button>
    </div>
    <div class="chat-msgs" id="chat-msgs" aria-live="polite"></div>
    <div class="chips">
      <button data-act="ask" data-q="¿Cuánto consumimos ahora?">Consumo ahora</button>
      <button data-act="ask" data-q="¿Qué zona consume más?">Zona top</button>
      <button data-act="ask" data-q="Dame un consejo de ahorro">Consejo</button>
    </div>
    <form class="chat-input-row" data-form="chat">
      <input class="inp" id="chat-input" placeholder="Pregunta sobre energía…" autocomplete="off" aria-label="Mensaje">
      <button class="btn" style="padding:0 14px" aria-label="Enviar">➤</button>
    </form>
  </div>
  <button id="chat-btn" data-act="chat" aria-label="Abrir asistente">🤖</button>
</div>

<div id="tip"></div>
<div id="toast" role="status"></div>

<script>
'use strict';
// ── CONFIG ───────────────────────────────────────────────────────────────────
const SB_URL = 'https://eeumiigdmgmviiodbqvx.supabase.co';
const SB_KEY = 'sb_publishable_DJMfzZSe-5QhPX17wgym0A_aljegDdQ'; // clave pública: la seguridad la da RLS
const TARIFA = 650;     // COP por kWh (estimado)
const CO2_KG = 0.126;   // kg CO₂ por kWh evitado (estimado red eléctrica Colombia)
const META_KWH = 700;   // meta diaria
const DEMO_MODE = true; // true: muestra la etiqueta "DEMO" (las lecturas del colegio son simuladas). Ponlo en false cuando haya sensores reales.
const TZ = 'America/Bogota';
// App Android: el archivo debe estar publicado junto a este index.html (o pon aquí la URL completa, p. ej. de GitHub Releases)
const APK = {url:'ecoenerg-ia.apk', version:'1.0.0', size:'77 MB', pkg:'co.edu.villassanignacio.ecoenergia', sha:'9e2d47c84e28e001987848b0bb8dab17c32601cca9f206b4fa4e513cecb518fe'};
// Cuentas de estudiante: una por curso, con permisos mínimos (solo ver datos y responder la trivia).
const STUDENT_PASS = 'Eco-Estudiante-2026';
const studentEmail = c => `curso-${c.toLowerCase().replace(/\s+/g,'-')}@ecoenerg.test`;
// Grupos por grado (cambia aquí cuántos hay en cada uno)
const GRUPOS = {6:3, 7:3, 8:3, 9:3, 10:3, 11:2};
const COURSES = [
  ...Object.entries(GRUPOS).flatMap(([g,n]) => Array.from({length:n}, (_,i) => `${g}-${i+1}`)),
  'Pensar 1', 'Pensar 2'
];
const ROLE_LABEL = {admin:'Administrador',docente:'Docente',estudiante:'Estudiante',tecnico:'Técnico'};
const TABS = {
  dashboard:{l:'⚡ Dashboard'}, zonas:{l:'🗺️ Zonas'}, ia:{l:'🤖 Análisis & Alertas'}, solar:{l:'☀️ Solar'},
  sensores:{l:'📡 Sensores IoT'}, educativo:{l:'🌱 Eco-Retos'}, reportes:{l:'📊 Reportes'}, admin:{l:'🛡️ Usuarios'}, app:{l:'📲 App Android'}
};
const TABS_BY_ROLE = {
  estudiante:['dashboard','zonas','solar','educativo','app'],
  docente:['dashboard','zonas','ia','solar','educativo','reportes','app'],
  tecnico:['dashboard','zonas','ia','solar','sensores','reportes','app'],
  admin:['dashboard','zonas','ia','solar','sensores','educativo','reportes','admin','app']
};

// ── HELPERS ──────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d=0) => Number(n).toLocaleString('es-CO', {minimumFractionDigits:d, maximumFractionDigits:d});
const sum = a => a.reduce((s,v)=>s+(v||0),0);
const dtf = new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'});
function bog(d){ const p={}; dtf.formatToParts(new Date(d)).forEach(x=>p[x.type]=x.value); return {day:`${p.year}-${p.month}-${p.day}`, hour:+p.hour}; }
const dayKey = offset => bog(Date.now()-offset*864e5).day;
const wd = key => new Date(key+'T12:00:00-05:00').toLocaleDateString('es-CO',{weekday:'short',timeZone:TZ}).replace('.','');
function ago(ts){ const s=(Date.now()-new Date(ts))/1000; if(s<60)return 'hace un momento'; if(s<3600)return `hace ${Math.floor(s/60)} min`; if(s<86400)return `hace ${Math.floor(s/3600)} h`; return `hace ${Math.floor(s/86400)} d`; }

      paintLive();

// ── DERIVED METRICS ──────────────────────────────────────────────────────────
function derive(){
  const days = {};
  S.hourly.forEach(r=>{ const p=bog(r.hour); (days[p.day] ??= Array.from({length:24},()=>null))[p.hour] = {kw:+r.avg_kw, solar:+r.avg_solar}; });
  const total = (key,f='kw',upTo=23) => sum((days[key]||[]).slice(0,upTo+1).map(x=>x?x[f]:0));
  const today = dayKey(0), yest = dayKey(1), curH = bog(Date.now()).hour;
  const series = (key,f='kw') => Array.from({length:24},(_,h)=> days[key]?.[h] ? days[key][h][f] : null);
  const last7 = Array.from({length:7},(_,i)=>dayKey(6-i));
  const daily = last7.map(k=>Math.round(total(k)));
  const todayKwh = total(today), todaySoFar = total(today,'kw',curH), ySoFar = total(yest,'kw',curH);
  const vsY = ySoFar>0 ? (todaySoFar/ySoFar-1)*100 : null;
  const solarToday = total(today,'solar');
  const solar7 = last7.map(k=>Math.round(total(k,'solar')));
  const profile = Array.from({length:24},(_,h)=>{ const v=Object.values(days).map(d=>d[h]?.kw).filter(x=>x!=null); return v.length? sum(v)/v.length : null; });
  const peakH = profile.reduce((b,v,h)=>v!=null && (b<0 || v>profile[b]) ? h : b, -1);
  // proyección: mismo día de la semana más reciente entre los días completos
  const complete = Array.from({length:7},(_,i)=>dayKey(7-i)).filter(k=>days[k] && days[k].filter(Boolean).length>=22);
  const avgDay = complete.length ? sum(complete.map(k=>total(k)))/complete.length : null;
  const forecast = Array.from({length:7},(_,i)=>{
    const key = new Date(Date.now()+(i+1)*864e5), k = wd(bog(key).day);
    const m = complete.filter(c=>wd(c)===k).pop();
    return {label:k, v: Math.round(m ? total(m) : (avgDay||0))};
  });
  return {days,today,yest,curH,series,last7,daily,todayKwh,vsY,solarToday,solar7,profile,peakH,avgDay,forecast,hasData:S.hourly.length>0};
}

// ── CHARTS (SVG propio, con tooltip) ─────────────────────────────────────────
const CH = {};
function chart(id, spec){
  CH[id] = spec;
  const W=600,H=spec.h||190,pl=36,pr=8,pt=10,pb=24,cw=W-pl-pr,chh=H-pt-pb;
  const all = spec.series.flatMap(s=>s.data).filter(v=>v!=null);
  if(!all.length) return `<div class="sub">Aún no hay datos para este gráfico.</div>`;
  const mx = Math.max(...all)*1.08 || 1, mn = spec.type==='bar' ? 0 : Math.max(0,Math.min(...all)*0.85);
  const n = spec.labels.length;
  const X = i => spec.type==='bar' ? pl + cw/n*(i+.5) : pl + (n>1? i*cw/(n-1) : cw/2);
  const Y = v => pt + chh - (v-mn)/(mx-mn)*chh;
  let g='';
  for(let i=0;i<=3;i++){ const v=mn+(mx-mn)*i/3, y=Y(v); g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#12344f" stroke-width="1"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${fmt(v)}</text>`; }
  const step = n>12 ? 3 : 1;
  spec.labels.forEach((l,i)=>{ if(i%step===0) g+=`<text x="${X(i)}" y="${H-7}" text-anchor="middle">${esc(l)}</text>`; });
  spec.series.forEach((s,si)=>{
    if(spec.type==='bar'){
      const bw = cw/n*(spec.series.length>1?.36:.58);
      s.data.forEach((v,i)=>{ if(v==null) return; const x=X(i)-bw*(spec.series.length)/2+si*bw, y=Y(v); const c=Array.isArray(s.color)?s.color[i]:s.color; g+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(1,pt+chh-y)}" rx="3" fill="${c}"/>`; });
    } else {
      let d='',seg=false,first=null,last=null;
      s.data.forEach((v,i)=>{ if(v==null){seg=false;return;} d+=(seg?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1); seg=true; if(first==null)first=i; last=i; });
      if(si===0 && first!=null && !s.dash) g+=`<defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".28"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs><path d="${d} L${X(last)},${pt+chh} L${X(first)},${pt+chh} Z" fill="url(#g${id})" stroke="none"/>`;
      g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.dash?1.6:2.4}" ${s.dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
    }
  });
  g+=`<line class="guide" x1="0" x2="0" y1="${pt}" y2="${pt+chh}" stroke="#ffffff55" stroke-width="1" style="display:none"/>`;
  const lg = spec.series.length>1 || spec.legend ? `<div class="legend">${spec.series.map(s=>`<span><i style="background:${Array.isArray(s.color)?s.color[0]:s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`:'';
  return `<div class="chart" data-chart="${id}" data-w="${W}" data-pl="${pl}" data-cw="${cw}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.aria||'Gráfico')}">${g}</svg></div>${lg}`;
}
function wireCharts(){
  document.querySelectorAll('.chart').forEach(el=>{
    const spec = CH[el.dataset.chart]; if(!spec) return;
    const svg = el.querySelector('svg'), guide = svg.querySelector('.guide');
    const W=+el.dataset.w, pl=+el.dataset.pl, cw=+el.dataset.cw, n=spec.labels.length;
    const move = e=>{
      const r = svg.getBoundingClientRect(), x = (e.clientX-r.left)/r.width*W;
      let i = spec.type==='bar' ? Math.floor((x-pl)/(cw/n)) : Math.round((x-pl)/cw*(n-1));
      i = Math.max(0,Math.min(n-1,i));
      const gx = spec.type==='bar' ? pl+cw/n*(i+.5) : pl+(n>1?i*cw/(n-1):cw/2);
      guide.setAttribute('x1',gx); guide.setAttribute('x2',gx); guide.style.display='';
      const rows = spec.series.filter(s=>s.data[i]!=null).map(s=>`<div><span style="color:${Array.isArray(s.color)?s.color[0]:s.color}">●</span> ${esc(s.name)}: <b>${fmt(s.data[i],spec.dec||0)}</b> ${esc(spec.unit||'')}</div>`).join('');
      const tip=$('tip'); tip.innerHTML=`<b>${esc(spec.labels[i])}</b>${rows}`; tip.style.display='block';
      const tw=tip.offsetWidth; tip.style.left=Math.min(innerWidth-tw-8,Math.max(8,e.clientX+12))+'px'; tip.style.top=Math.max(8,e.clientY-60)+'px';
    };
    el.addEventListener('pointermove',move); el.addEventListener('pointerdown',move);
    el.addEventListener('pointerleave',()=>{ guide.style.display='none'; $('tip').style.display='none'; });
  });
}
function gauge(value,size=80,color='#00e5b4',label=''){
  const r=(size-10)/2,c=2*Math.PI*r,off=c-(Math.max(0,Math.min(100,value))/100)*c;
  return `<div class="gauge-wrap" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(label)} ${value}%"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#12344f" stroke-width="6"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="6" stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round" transform="rotate(-90 ${size/2} ${size/2})"/></svg><div class="gauge-inner"><span class="gauge-val" style="color:${color};font-size:${Math.max(10,size/6)}px">${value}%</span></div></div>`;
}
function donut(data,center){
  const R=60,C=2*Math.PI*R,tot=sum(data.map(d=>d.pct))||1; let off=0;
  const arcs=data.map(d=>{ const len=d.pct/tot*C, s=`<circle cx="80" cy="80" r="${R}" fill="none" stroke="${esc(d.color)}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"><title>${esc(d.category)}: ${d.pct}%</title></circle>`; off+=len; return s; }).join('');
  return `<svg width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Distribución del consumo por área" style="flex-shrink:0">${arcs}<text x="80" y="80" text-anchor="middle" fill="#e6edf5" font-size="20" font-weight="800">${esc(center)}</text><text x="80" y="98" text-anchor="middle" fill="#7e9bb8" font-size="10">kW ahora</text></svg>`;
}

function zoneCard(z, tot, name){
  const col=statusColor(z.status), pct=tot?+z.kw/tot*100:0;
  return `<div class="zone-card" style="border-left:3px solid ${col}">
    <div class="zone-icon">${esc(z.icon)}</div>
    <div class="zone-info"><div class="zone-name">${esc(name)}</div><div class="zone-meta">${z.sensors_count} sensores · ${fmt(pct)}% del total</div>
      <div class="bar-track" style="margin-top:8px"><div class="bar-fill" style="width:${pct}%;background:${col}"></div></div></div>
    <div class="zone-right"><div class="zone-kw" style="color:${col}">${fmt(z.kw,1)} kW</div>
      <span class="badge" style="color:${col};border-color:${col}55;background:${col}18">${statusLabel(z.status)}</span>
      ${gauge(z.efficiency,48,col,'Eficiencia')}
      ${canWrite()?`<select class="inp" data-change="zstatus" data-id="${z.id}" aria-label="Estado de ${esc(z.name)}" style="margin:2px 0 0;padding:4px 6px;font-size:11px;width:auto">${['normal','warning','alert'].map(st=>`<option value="${st}" ${st===z.status?'selected':''}>${statusLabel(st)}</option>`).join('')}</select>`:''}</div></div>`;
}
function vZonas(){
  const tot=sum(S.zones.map(z=>+z.kw)), c=s=>S.zones.filter(z=>z.status===s).length;
  // Los nombres "Piso N - Área" se agrupan por piso; el resto va en "Otras zonas".
  const groups={};
  S.zones.forEach(z=>{ const m=/^Piso\s+(\d+)\s*-\s*(.+)$/.exec(z.name); const k=m?m[1]:'0'; (groups[k] ??= []).push({z, name:m?m[2]:z.name}); });
  const keys=Object.keys(groups).sort((a,b)=>((a==='0')-(b==='0')) || (a-b));
  const worst=l=>l.some(x=>x.z.status==='alert')?'alert':l.some(x=>x.z.status==='warning')?'warning':'normal';
  const body=keys.map(k=>{ const l=groups[k], col=statusColor(worst(l));
    return `<div class="row" style="justify-content:space-between;margin:18px 0 8px"><div class="card-title" style="margin:0;color:${col}">${k==='0'?'Otras zonas':'Piso '+k}</div><div class="sub" style="margin:0">${l.length} zona${l.length>1?'s':''} · <b>${fmt(sum(l.map(x=>+x.z.kw)),1)} kW</b></div></div>`
      + l.map(x=>zoneCard(x.z,tot,x.name)).join(''); }).join('');
  return `<div class="section-title">🗺️ Zonas del Colegio</div>
  <div class="grid2 mb"><div class="card"><div class="card-title">Zonas</div><div class="stat-val">${S.zones.length}</div><div class="sub">${c('normal')} óptimas · ${c('warning')} moderadas · ${c('alert')} en alerta</div></div>
  <div class="card"><div class="card-title">Consumo por zonas</div><div><span class="stat-val">${fmt(tot,1)}</span><span class="stat-unit">kW</span></div><div class="sub">Capacidad típica de uso diurno</div></div></div>
  ${body||'<div class="card sub">No hay zonas registradas.</div>'}`;
}

function insights(d){
  const out=[]; const price=TARIFA;
  if(d.avgDay) out.push({kind:'prediccion',title:'Proyección de factura',msg:`A este ritmo (${fmt(d.avgDay)} kWh/día) el mes costaría cerca de $${fmt(d.avgDay*30*price)} COP. Estimado con tarifa de $${price}/kWh.`});
  if(d.peakH>=0) out.push({kind:'anomalia',title:'Hora pico',msg:`El mayor consumo promedio se da a las ${d.peakH}:00 (${fmt(d.profile[d.peakH],1)} kW). Es la hora con más potencial de ahorro.`});
  S.zones.filter(z=>z.status==='alert').forEach(z=>out.push({kind:'anomalia',title:'Zona en alerta',msg:`${z.name} marca ${fmt(z.kw,1)} kW con eficiencia de ${z.efficiency}%. Conviene revisar equipos encendidos.`}));
  S.panels.filter(p=>!p.ok).forEach(p=>out.push({kind:'anomalia',title:'Panel solar con falla',msg:`El panel ${p.code} rinde solo ${p.output_pct}%. Programa una revisión o limpieza.`}));
  if(d.vsY!=null && d.vsY<=-5) out.push({kind:'logro',title:'Vas por buen camino',msg:`Hoy consumes ${fmt(Math.abs(d.vsY),1)}% menos que ayer a esta misma hora.`});
  return out;
}
function vIA(){

  ${S.alerts.map(a=>card(a, canWrite()&&!a.resolved?`<div style="margin-top:8px"><button class="btn sm ghost" data-act="resolve" data-id="${a.id}">Marcar resuelta</button></div>`:'')).join('')||'<div class="sub">No hay alertas.</div>'}
  ${canWrite()?`<div class="card"><div class="card-title">Crear alerta</div><form data-form="alert">
    <label class="f" for="a-kind">Tipo</label><select class="inp" id="a-kind" name="kind"><option value="anomalia">Anomalía</option><option value="recomend">Recomendación</option><option value="prediccion">Predicción</option><option value="logro">Logro</option></select>

  const pal=['#00e5b4','#4c8dff','#fbbf24','#a78bfa','#f87171'];
  const zname=id=>S.zones.find(z=>z.id===id)?.name||'—';
  return `<div class="section-title">📡 Sensores IoT</div>
  <div class="grid3 mb"><div class="card" style="text-align:center"><div style="font-size:24px;font-weight:900;color:var(--green)">${total}</div><div class="card-title" style="margin:0">Instalados</div></div>
  <div class="card" style="text-align:center"><div style="font-size:24px;font-weight:900;color:#4c8dff">${total-bad}</div><div class="card-title" style="margin:0">En línea</div></div>
  <div class="card" style="text-align:center"><div style="font-size:24px;font-weight:900;color:var(--red)">${bad}</div><div class="card-title" style="margin:0">Alertas</div></div></div>

const authError = e => {
  const x=e?.message||'', st=e?.status;
  if(/invalid login|invalid_credentials/i.test(x)) return 'Correo o contraseña incorrectos.';
  if(/confirm/i.test(x)) return 'Esa cuenta aún no está confirmada.';
  if(/rate|too many/i.test(x) || st===429) return 'Demasiados intentos. Espera un momento.';
  if(/timeout/i.test(x)) return 'El servidor no respondió. Revisa tu internet e inténtalo de nuevo.';
  if(/fetch|network|load failed/i.test(x) || st===0 || st===undefined) return 'No hay conexión con el servidor. Revisa tu internet (o abre la página desde su dirección web, no desde un archivo o vista previa).';
  return 'No se pudo ingresar (' + (st?st+' · ':'') + x.slice(0,120) + ').';
};
async function signIn(email, password, btn, label, staff){
  btn.disabled=true; btn.textContent='Entrando…';
  try{
    const res = await Promise.race([
      sb.auth.signInWithPassword({email,password}),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),15000))
    ]);
    if(res.error) throw res.error;
    if(res.data?.session) enterApp(res.data.session.user);   // no depender solo del evento SIGNED_IN
  }catch(e){
    console.error('login', e);
    S.authMsg={t:'err',x:authError(e)}; S.staffOpen=!!staff; renderAuth();
  }
}
function doStudent(f){
  const course=new FormData(f).get('course');
  if(!course){ S.authMsg={t:'err',x:'Elige tu curso para ingresar.'}; return renderAuth(); }
  return signIn(studentEmail(course), STUDENT_PASS, $('st-btn'), 'Ingresar', false);
}
function doAuth(f){
  const fd=new FormData(f), email=fd.get('email').trim(), password=fd.get('password');
  if(!email||!password){ S.authMsg={t:'err',x:'Escribe tu correo y tu contraseña.'}; S.staffOpen=true; return renderAuth(); }
  return signIn(email, password, $('au-btn'), 'Entrar', true);
}

async function enterApp(user){
  if(S.entering) return; S.entering=true;
  S.user=user;
  $('boot').classList.remove('hidden'); $('auth').classList.add('hidden');
  try{
    let prof = await q(sb.from('profiles').select('*').eq('id',user.id).maybeSingle());
    if(!prof){ await new Promise(r=>setTimeout(r,800)); prof = await q(sb.from('profiles').select('*').eq('id',user.id).maybeSingle()); }
    if(!prof) throw new Error('perfil');
    S.profile=prof;
    await loadAll();
  }catch(e){
    S.entering=false; console.error('cargar', e);
    $('boot').innerHTML=`<div class="card" style="max-width:360px"><div class="card-title">No se pudo cargar</div><div class="sub">Revisa tu conexión e inténtalo de nuevo.</div><div class="sub" style="opacity:.7;word-break:break-word">${esc(String(e?.message||e).slice(0,160))}</div><div class="row" style="margin-top:10px"><button class="btn" data-act="retry">Reintentar</button><button class="btn ghost" data-act="logout">Salir</button></div></div>`; return;
  }
  $('boot').classList.add('hidden'); $('app').classList.remove('hidden'); $('chat-fab').classList.remove('hidden');
  $('u-name').textContent=S.profile.full_name||user.email; $('u-role').textContent=ROLE_LABEL[S.profile.role];
  $('demo-tag').classList.toggle('hidden', !DEMO_MODE);
  renderNav(); renderTab(); paintLive(); subscribe();
  S.entering=false;
}
function leaveApp(){
  if(channel){ sb.removeChannel(channel); channel=null; }
  clearInterval(autoT); S.auto=false;
  Object.assign(S,{user:null,profile:null,tab:'dashboard',triviaIdx:0,entering:false,authMsg:null});
  $('app').classList.add('hidden'); $('chat-fab').classList.add('hidden'); $('chat-window').classList.add('hidden');
  $('boot').innerHTML='<div class="spinner"></div>'; renderAuth();
}

// ── ASISTENTE (reglas locales sobre datos reales) ────────────────────────────
function answer(t){
  t=t.toLowerCase(); const d=derive();
  if(!S.live && !S.zones.length) return 'Todavía no hay datos cargados.';
  if(/ahora|actual|consum|kw|cuánt|cuant/.test(t) && !/zona|ahorr|consej/.test(t)) return S.live?`Ahora el colegio consume ${fmt(S.live.kw,1)} kW y la generación solar es de ${fmt(S.live.solar,1)} kW. Hoy llevamos ${fmt(d.todayKwh)} kWh${d.vsY!=null?` (${d.vsY<=0?'−':'+'}${fmt(Math.abs(d.vsY),1)}% vs ayer a esta hora)`:''}. ⚡`:'No hay lecturas recientes.';
  if(/zona|bloque|lab|cafe|auditorio/.test(t)){ const z=[...S.zones].sort((a,b)=>b.kw-a.kw); return z.length?`La zona que más consume es ${z[0].name} con ${fmt(z[0].kw,1)} kW (eficiencia ${z[0].efficiency}%). Le sigue ${z[1]?.name||'—'} con ${fmt(z[1]?.kw||0,1)} kW. 🗺️`:'No hay zonas registradas.'; }
  if(/solar|panel|sol\b/.test(t)){ const bad=S.panels.filter(p=>!p.ok); return `Hoy los paneles han generado ${fmt(d.solarToday)} kWh. ${bad.length?`Ojo: ${bad.map(p=>p.code).join(', ')} rinde${bad.length>1?'n':''} por debajo de lo normal. 🔧`:'Todos los paneles funcionan bien. ☀️'}`; }
  if(/alerta|anomal|problema|falla/.test(t)){ const o=S.alerts.filter(a=>!a.resolved); return o.length?`Hay ${o.length} alerta(s) abierta(s). La más reciente: “${o[0].title}” — ${o[0].message} ⚠️`:'No hay alertas abiertas ahora mismo. ✅'; }
  if(/sensor/.test(t)){ const b=S.sensors.filter(s=>!s.ok); return b.length?`${b.length} sensor(es) con alerta: ${b.map(s=>`${s.code} (${s.location})`).join(', ')}. 📡`:'Todos los sensores reportan normal. 📡'; }
  if(/ranking|curso|punt|reto|trivia/.test(t)){ const s=S.scores[0]; return s?`Va ganando ${s.course} con ${fmt(s.points)} puntos. Responde la trivia en Eco-Retos para sumar puntos a tu curso. 🏆`:'Aún no hay puntajes.'; }
  if(/ahorr|consej|recomend|reduc|tip/.test(t)){ const tips=[]; if(d.peakH>=0) tips.push(`Evita encender equipos grandes a las ${d.peakH}:00, que es la hora pico.`); const w=[...S.zones].sort((a,b)=>a.efficiency-b.efficiency)[0]; if(w) tips.push(`Revisa ${w.name}: tiene la eficiencia más baja (${w.efficiency}%).`); tips.push('Apaga luces y computadores en salones vacíos; el LED ahorra hasta 80% frente a incandescentes.'); return '💡 '+tips.join('\n'); }
  return 'Puedo contarte sobre el consumo actual, las zonas, la energía solar, las alertas, los sensores, el ranking o darte consejos de ahorro. 🌱';
}
function chatRender(){ const el=$('chat-msgs'); el.innerHTML=S.chat.map(m=>`<div class="chat-msg ${m.from}">${esc(m.text)}</div>`).join(''); el.scrollTop=el.scrollHeight; }
function ask(text){ if(!text.trim()) return; S.chat.push({from:'user',text}); S.chat.push({from:'ai',text:answer(text)}); chatRender(); }

// ── ACCIONES ─────────────────────────────────────────────────────────────────
let deferredPrompt=null;
async function guard(fn, okMsg){ try{ await fn(); if(okMsg) toast(okMsg); }catch(e){ toast(/row-level|permission|no autorizado/i.test(e.message||'')?'No tienes permiso para esta acción.':'No se pudo completar la acción.'); } }
const ACT = {
  tab:b=>{ S.tab=b.tab; renderNav(); renderTab(); scrollTo(0,0); },
  logout:async()=>{ await sb.auth.signOut(); },
  retry:()=>enterApp(S.user),
  chat:()=>{ const w=$('chat-window'); w.classList.toggle('hidden'); if(!w.classList.contains('hidden')){ chatRender(); $('chat-input').focus(); } },
  ask:b=>ask(b.q),
  install:async()=>{ if(!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; $('install-banner').classList.add('hidden'); },
  nextq:()=>{ S.triviaIdx=(S.triviaIdx+1)%Math.max(1,S.trivia.length); renderTab(); },
  answer:b=>guard(async()=>{
    const t=S.trivia[S.triviaIdx], i=+b.i, ok=i===t.correct;
    const {error}=await sb.from('trivia_answers').insert({user_id:S.user.id,trivia_id:t.id,choice:i,is_correct:ok});
    if(error) throw error;
    S.answers[t.id]={trivia_id:t.id,choice:i,is_correct:ok}; await reload.scores().catch(()=>{}); renderTab();
  }, null),
  resolve:b=>guard(async()=>{ await q(sb.from('alerts').update({resolved:true}).eq('id',b.id)); await reload.alerts(); renderTab(); },'Alerta resuelta'),
  sensor:b=>guard(async()=>{ await q(sb.from('sensors').update({ok:b.ok!=='true',updated_at:new Date().toISOString()}).eq('code',b.code)); await reload.sensors(); renderTab(); }),
  panel:b=>guard(async()=>{ await q(sb.from('solar_panels').update({ok:b.ok!=='true'}).eq('code',b.code)); await reload.panels(); renderTab(); }),
  simulate:()=>guard(async()=>{ const {error}=await sb.rpc('simulate_reading'); if(error) throw error; },'Lectura generada'),
  auto:()=>{ S.auto=!S.auto; clearInterval(autoT); if(S.auto) autoT=setInterval(()=>{ if(S.tab!=='sensores'){ S.auto=false; clearInterval(autoT); return; } sb.rpc('simulate_reading').then(()=>{},()=>{}); },5000); renderTab(); },
  csv:()=>{ const rows=['hora_bogota,consumo_kw_prom,solar_kw_prom',...S.hourly.map(r=>`${new Date(r.hour).toLocaleString('sv-SE',{timeZone:TZ})},${r.avg_kw},${r.avg_solar}`)]; const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'})); a.download='ecoenerg-consumo.csv'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
};
const CHANGE = {
  role:(el)=>guard(async()=>{ await q(sb.from('profiles').update({role:el.value}).eq('id',el.dataset.id)); await reload.users(); renderTab(); },'Rol actualizado'),
  zstatus:(el)=>guard(async()=>{ await q(sb.from('zones').update({status:el.value}).eq('id',+el.dataset.id)); await reload.zones(); renderTab(); },'Estado de zona actualizado')
};
const FORMS = {
  auth:f=>doAuth(f),
  student:f=>doStudent(f),
  chat:f=>{ const i=$('chat-input'); ask(i.value); i.value=''; },
  alert:f=>guard(async()=>{ const fd=new FormData(f); await q(sb.from('alerts').insert({kind:fd.get('kind'),title:fd.get('title').trim(),message:fd.get('message').trim()})); await reload.alerts(); renderTab(); },'Alerta publicada'),
  trivia:f=>guard(async()=>{ const fd=new FormData(f); await q(sb.from('trivia').insert({question:fd.get('question').trim(),options:[0,1,2,3].map(i=>fd.get('o'+i).trim()),correct:+fd.get('correct'),explanation:fd.get('explanation').trim()})); await reload.trivia(); renderTab(); },'Pregunta guardada')
};
document.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(b && ACT[b.dataset.act]){ e.preventDefault(); ACT[b.dataset.act](b.dataset,b); } });
document.addEventListener('change',e=>{ const el=e.target.closest('[data-change]'); if(el && CHANGE[el.dataset.change]) CHANGE[el.dataset.change](el); });
function runForm(f){ if(!f || !FORMS[f.dataset.form]) return; if(!f.noValidate && f.reportValidity && !f.reportValidity()) return; FORMS[f.dataset.form](f); }
// Se atienden clic y Enter directamente: en vistas previas (iframe con sandbox) el envío nativo de formularios está bloqueado.
document.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b || b.dataset.act) return; const f=b.closest('[data-form]'); if(!f || (b.getAttribute('type')||'submit')!=='submit') return; e.preventDefault(); runForm(f); });
document.addEventListener('keydown',e=>{ if(e.key!=='Enter' || !e.target.closest) return; const t=e.target; if(t.tagName==='TEXTAREA'||t.tagName==='BUTTON') return; const f=t.closest('[data-form]'); if(!f) return; e.preventDefault(); runForm(f); });
document.addEventListener('submit',e=>{ const f=e.target.closest('[data-form]'); if(f){ e.preventDefault(); runForm(f); } });
let rz; addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(S.user && S.profile) { const y=scrollY; renderTab(); scrollTo(0,y); } },250); });

// ── PWA ──────────────────────────────────────────────────────────────────────
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; $('install-banner').classList.remove('hidden'); });
addEventListener('appinstalled',()=>$('install-banner').classList.add('hidden'));

// ── INIT ─────────────────────────────────────────────────────────────────────
(async function init(){
  if(!window.supabase){ $('boot').innerHTML='<div class="card" style="max-width:360px"><div class="card-title">Sin conexión</div><div class="sub">No se pudo cargar el servicio de datos. Revisa tu internet y recarga la página.</div></div>'; return; }
  sb = window.supabase.createClient(SB_URL, SB_KEY);
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==='SIGNED_OUT') leaveApp();
    else if(ev==='SIGNED_IN' && session && S.user?.id!==session.user.id) setTimeout(()=>enterApp(session.user),0);
  });
  const {data:{session}} = await sb.auth.getSession();
  if(session) enterApp(session.user); else renderAuth();
})();
</script>
